[workspace]
resolver = "3"
members = [
    "crates/hypercarry-core",
    "crates/hypercarry-cli",
    "crates/hypercarry-recorder",
    "crates/hypercarry-storage",
    "crates/hypercarry-execution",
    "crates/hypercarry-testnet-operator",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/john-lawniczak/hypercarry"
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1"
alloy = { version = "2", default-features = false, features = ["signers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-with-str"] }
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.3"
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
parquet = { version = "59.2", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
arrow-array = "59.2"
arrow-schema = "59.2"
bytes = "1"
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
hypersdk = "=0.2.15"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
