[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Transitive through alloy-primitives (public wire types only). This advisory reports only that
    # paste is archived; it is not a vulnerability and has no safe upgrade.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
# Prevent feature unification from re-enabling Alloy's legacy crypto stack.
deny = [
    { name = "crypto-bigint", version = "<0.7.10" },
    { name = "k256", version = "<0.14.0" },
    { name = "elliptic-curve", version = "<0.14.3" },
    { name = "hypersdk" },
    { name = "alloy-signer" },
]
# The workspace already spans networking/storage generations. Advisories,
# licenses, wildcard dependencies, and registry provenance remain enforced.
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
