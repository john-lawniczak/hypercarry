name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the documentation-drift report compares each living
          # document's last commit against commits touching crates/, which a
          # shallow clone cannot answer.
          fetch-depth: 0
      - name: reject known malicious Rust crates
        run: tools/check-rust-supply-chain.sh
      # Advisory only. The pre-commit hook is the enforcement point; this step
      # makes accumulated drift visible when that hook was bypassed, without
      # failing a legitimate refactor that genuinely changes no documented claim.
      - name: report living-documentation drift
        continue-on-error: true
        run: tools/check-docs-current.sh
      - name: install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: audit dependencies, licenses, and sources
        run: cargo deny check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: release tooling regressions
        run: python3 -B -m unittest discover -s tools/tests -v
      - name: validate passive AWS reference template
        run: |
          python3 -m venv /tmp/hypercarry-cfn-lint
          /tmp/hypercarry-cfn-lint/bin/pip install cfn-lint==1.48.0
          /tmp/hypercarry-cfn-lint/bin/cfn-lint deploy/mainnet/aws-reference.json
      - name: public export boundaries and documentation links
        run: python3 -B tools/check_public_export.py
      - name: format
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: test
        run: cargo test --workspace --all-features --locked
      - name: build
        run: cargo build --workspace --all-features --release --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-1.94.1
      - name: check minimum supported Rust version
        run: cargo check --workspace --all-targets --all-features --locked
