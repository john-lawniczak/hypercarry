[package]
name = "hypercarry-notifications"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Local durable alert outbox and opt-in email/SMS delivery; no wallet access."

[features]
default = []
delivery = ["dep:reqwest", "dep:clap"]

[[bin]]
name = "hypercarry-notify"
path = "src/main.rs"
required-features = ["delivery"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
sha2 = "0.11"
fs2 = "0.4"
tempfile = "3"
reqwest = { workspace = true, features = ["blocking", "json", "form"], optional = true }
clap = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[lints]
workspace = true
