[package]
name = "hypercarry-supervisor"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Default-off account-health supervisor that writes the executor's health file."

[features]
default = []
mainnet-execution = [
    "hypercarry-execution/mainnet-execution",
    "hypercarry-mainnet-config/mainnet-execution",
]

[[bin]]
name = "hypercarry-supervisor"
path = "src/main.rs"
required-features = ["mainnet-execution"]

[[bin]]
name = "hypercarry-operations-probe"
path = "src/bin/operations_probe.rs"
required-features = ["mainnet-execution"]

[dependencies]
hypercarry-execution = { version = "=0.0.0", path = "../hypercarry-execution" }
hypercarry-mainnet-config = { version = "=0.0.0", path = "../hypercarry-mainnet-config" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
signal-hook = "0.4"
tempfile = "3"
sha2 = "0.11"
fs2 = "0.4"
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
hypercarry-executor = { version = "=0.0.0", path = "../hypercarry-executor", features = ["mainnet-execution"] }
tempfile = "3"

[lints]
workspace = true
