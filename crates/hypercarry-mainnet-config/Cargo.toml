[package]
name = "hypercarry-mainnet-config"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Shared mainnet runtime configuration and its reviewed digest."

[features]
default = []
# Gates the health-file contract, which needs mainnet-only execution types.
# Keeping it off by default leaves the workspace's default build unchanged.
mainnet-execution = ["hypercarry-execution/mainnet-execution"]

[dependencies]
hypercarry-execution = { version = "=0.0.0", path = "../hypercarry-execution" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"

[dev-dependencies]
rust_decimal.workspace = true
tempfile = "3"

[lints]
workspace = true
