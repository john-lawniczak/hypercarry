[package]
name = "hypercarry-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CLI for Hyperliquid snapshots, live recording, durable backfills, and research metrics."

[[bin]]
name = "hypercarry"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
crossterm.workspace = true
hypercarry-core = { version = "=0.0.0", path = "../hypercarry-core" }
hypercarry-recorder = { version = "=0.0.0", path = "../hypercarry-recorder" }
hypercarry-storage = { version = "=0.0.0", path = "../hypercarry-storage" }
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
ratatui.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
