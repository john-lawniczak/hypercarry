[package]
name = "hypercarry-executor"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Default-off manual mainnet canary executor with external signing."

[features]
default = []
mainnet-execution = ["hypercarry-hyperliquid/mainnet-execution", "hypercarry-execution/mainnet-execution", "hypercarry-mainnet-config/mainnet-execution"]

[[bin]]
name = "hypercarry-executor"
path = "src/main.rs"
required-features = ["mainnet-execution"]

[dependencies]
hypercarry-execution = { version = "=0.0.0", path = "../hypercarry-execution" }
hypercarry-hyperliquid = { version = "=0.0.0", path = "../hypercarry-hyperliquid" }
hypercarry-mainnet-config = { version = "=0.0.0", path = "../hypercarry-mainnet-config" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
sha2 = "0.11"
signal-hook = "0.4"
tempfile = "3"
reqwest = { workspace = true, features = ["blocking", "json"] }

[build-dependencies]
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
