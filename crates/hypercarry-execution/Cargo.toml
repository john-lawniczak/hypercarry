[package]
name = "hypercarry-execution"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Optional venue-neutral execution simulation and non-signing dry-run boundary for hypercarry."

[features]
default = []
mainnet-execution = []
testnet-execution = ["dep:hypercarry-core", "dep:hypercarry-recorder", "dep:reqwest"]
hypersdk-signer = [
    "testnet-execution",
    "dep:alloy",
    "dep:chrono",
    "dep:hypersdk",
]

[dependencies]
alloy = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
fs2 = "0.4"
hypercarry-core = { version = "=0.0.0", path = "../hypercarry-core", optional = true }
hypercarry-recorder = { version = "=0.0.0", path = "../hypercarry-recorder", optional = true }
hypersdk = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["blocking", "json"] }
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
