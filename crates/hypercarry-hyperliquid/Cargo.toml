[package]
name = "hypercarry-hyperliquid"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Isolated Hyperliquid testnet and capability-gated mainnet adapters."

[features]
default = []
testnet-execution = []
mainnet-execution = ["testnet-execution", "hypersdk-signer", "hypercarry-execution/mainnet-execution"]
hypersdk-signer = ["testnet-execution", "dep:alloy", "dep:chrono", "dep:hypersdk"]

[dependencies]
hypercarry-execution = { version = "=0.0.0", path = "../hypercarry-execution" }
hypercarry-core = { version = "=0.0.0", path = "../hypercarry-core" }
hypercarry-recorder = { version = "=0.0.0", path = "../hypercarry-recorder" }
reqwest = { workspace = true, features = ["blocking", "json"] }
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
alloy = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
hypersdk = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
tokio.workspace = true

[lints]
workspace = true
