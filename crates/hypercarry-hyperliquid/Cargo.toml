[package]
name = "hypercarry-hyperliquid"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Isolated Hyperliquid testnet and capability-gated mainnet adapters."

[features]
default = []
testnet-execution = []
mainnet-execution = ["testnet-execution", "local-signer", "hypercarry-execution/mainnet-execution"]
local-signer = ["testnet-execution", "dep:chrono", "dep:hypercarry-signing"]
# Deprecated feature alias; the old SDK is no longer a dependency.
hypersdk-signer = ["local-signer"]

[dependencies]
hypercarry-execution = { version = "=0.0.0", path = "../hypercarry-execution" }
hypercarry-core = { version = "=0.0.0", path = "../hypercarry-core" }
hypercarry-recorder = { version = "=0.0.0", path = "../hypercarry-recorder" }
reqwest = { workspace = true, features = ["blocking", "json"] }
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { workspace = true, optional = true }
hypercarry-signing = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
tokio.workspace = true

[lints]
workspace = true
