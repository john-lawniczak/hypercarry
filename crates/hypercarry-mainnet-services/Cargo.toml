[package]
name = "hypercarry-mainnet-services"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
mainnet-execution = ["hypercarry-executor/mainnet-execution", "hypercarry-mainnet-config/mainnet-execution"]

[[bin]]
name = "hypercarry-mainnet-signer"
path = "src/bin/signer.rs"
required-features = ["mainnet-execution"]

[[bin]]
name = "hypercarry-watchdog"
path = "src/bin/watchdog.rs"
required-features = ["mainnet-execution"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
chrono.workspace = true
alloy.workspace = true
hypersdk.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
hypercarry-execution = { version = "=0.0.0", path = "../hypercarry-execution" }
hypercarry-executor = { version = "=0.0.0", path = "../hypercarry-executor" }
hypercarry-mainnet-config = { version = "=0.0.0", path = "../hypercarry-mainnet-config" }
sha2 = "0.11"
fs2 = "0.4"
tempfile = "3"
signal-hook = "0.4"

[lints]
workspace = true
