[package]
name = "hypercarry-mainnet-services"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
mainnet-execution = ["hypercarry-executor/mainnet-execution", "hypercarry-mainnet-config/mainnet-execution", "hypercarry-supervisor/mainnet-execution"]

[[bin]]
name = "hypercarry-mainnet-signer"
path = "src/bin/signer.rs"
required-features = ["mainnet-execution"]

[[bin]]
name = "hypercarry-kms-provider"
path = "src/bin/kms_provider.rs"
required-features = ["mainnet-execution"]

[[bin]]
name = "hypercarry-watchdog"
path = "src/bin/watchdog.rs"
required-features = ["mainnet-execution"]

[[bin]]
name = "hypercarry-doctor"
path = "src/bin/doctor.rs"
required-features = ["mainnet-execution"]

[dependencies]
hypercarry-supervisor = { version = "=0.0.0", path = "../hypercarry-supervisor" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
chrono.workspace = true
hypercarry-signing.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
hypercarry-execution = { version = "=0.0.0", path = "../hypercarry-execution" }
hypercarry-executor = { version = "=0.0.0", path = "../hypercarry-executor" }
hypercarry-mainnet-config = { version = "=0.0.0", path = "../hypercarry-mainnet-config" }
sha2 = "0.11"
fs2 = "0.4"
tempfile = "3"
signal-hook = "0.4"
base64 = "0.22"
rustix = { version = "1", features = ["process"] }

[lints]
workspace = true
