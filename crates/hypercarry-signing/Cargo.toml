[package]
name = "hypercarry-signing"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
serde.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
alloy-primitives = { version = "1.7.1", default-features = false, features = ["std", "serde"] }
alloy-sol-types = { version = "1.7.1", default-features = false, features = ["std"] }
k256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "std"] }
# Deliberately constrain the transitive curve dependency to the reviewed patch.
crypto-bigint = { version = "=0.7.10", default-features = false }
rmp-serde = "1.3"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
